```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แนะนำตัว - ตุ้ยนุ้ย</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Sarabun',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.card{
    background:#fff;
    padding:30px;
    width:350px;
    text-align:center;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.avatar{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    background:#ff7b7b;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin-bottom:20px;
}

h1{
    color:#333;
    margin-bottom:10px;
}

p{
    color:#666;
    line-height:1.6;
    margin-top:10px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#ff7b7b;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:#ff5c5c;
}
</style>
</head>

<body>
<div class="card">
    <div class="avatar">😊</div>
    <h1>สวัสดีครับ</h1>
    <h2>ผมชื่อ ตุ้ยนุ้ย</h2>
    <p>
        ยินดีต้อนรับสู่หน้าแนะนำตัวของผม<br>
        ชอบเรียนรู้สิ่งใหม่ ๆ และสนใจเทคโนโลยี
    </p>
    <a href="#" class="btn">ติดต่อฉัน</a>
</div>
</body>
</html>
```
